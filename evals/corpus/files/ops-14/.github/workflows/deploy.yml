name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: northwind/api

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::412983776105:role/github-deploy-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build \
            --file services/api/Dockerfile \
            --secret id=npmrc,env=NPMRC \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "${{ steps.meta.outputs.image }}" \
            .
          docker push "${{ steps.meta.outputs.image }}"
        env:
          NPMRC: ${{ secrets.NPMRC }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::412983776105:role/github-deploy-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out
        run: |
          aws eks update-kubeconfig --name "platform-${ENVIRONMENT}" --region "${AWS_REGION}"
          kubectl -n "platform-${ENVIRONMENT}" set image deployment/api api="${IMAGE}"
          kubectl -n "platform-${ENVIRONMENT}" rollout status deployment/api --timeout=5m
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          IMAGE: ${{ needs.build.outputs.image }}

      - name: Notify release channel
        if: always()
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"api deploy to ${ENVIRONMENT}: ${{ job.status }}\"}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
