name: nightly-etl

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: First day to reload (YYYY-MM-DD); defaults to seven days ago
        required: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SNOWFLAKE_ACCOUNT: nw48213.eu-west-1
      SNOWFLAKE_USER: ETL_LOADER
      SNOWFLAKE_PASSWORD: "Kd9!vR2qLx7#mTe4Wz"
      SNOWFLAKE_WAREHOUSE: LOAD_WH
      SNOWFLAKE_DATABASE: ANALYTICS
      SNOWFLAKE_ROLE: LOADER
      LEDGER_DATABASE_URL: ${{ secrets.LEDGER_REPLICA_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@abf30c16e794da8c52e553b0f3cd4b5b6a291dfd # v3.2.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        run: uv sync --frozen --project pipelines/warehouse

      - name: Resolve window
        id: window
        run: |
          start="${{ inputs.start_date }}"
          if [ -z "$start" ]; then
            start="$(date -u -d '7 days ago' +%F)"
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Extract and load
        run: |
          uv run --project pipelines/warehouse python -m warehouse.load \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --tables invoices,invoice_lines,payments,refunds,subscriptions

      - name: Run dbt models
        run: |
          uv run --project pipelines/warehouse dbt build \
            --project-dir pipelines/warehouse/dbt \
            --target prod \
            --select "state:modified+ tag:nightly"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: pipelines/warehouse/dbt/target/
          retention-days: 14

      - name: Alert data team on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: C04QX8M2T9L
          slack-message: "nightly-etl failed for ${{ steps.window.outputs.start }}..${{ steps.window.outputs.end }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
