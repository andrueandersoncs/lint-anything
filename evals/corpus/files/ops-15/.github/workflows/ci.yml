name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version-file: .nvmrc
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Lint shell scripts
        uses: docker://koalaman/shellcheck:v0.10.0
        with:
          args: --severity=warning scripts/backup_postgres.sh scripts/rotate_logs.sh deploy/release.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: ledger_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version-file: .nvmrc
      - name: Run tests
        run: pnpm run test --shard=${{ matrix.shard }}/4 --coverage
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/ledger_test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/
          retention-days: 3

  coverage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/
      - name: Upload to Codecov
        uses: codecov/codecov-action@8941edbfc3c326b8f8e7b5e995a1bac1e2c712f2 # v4.6.0
        with:
          directory: coverage/
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
