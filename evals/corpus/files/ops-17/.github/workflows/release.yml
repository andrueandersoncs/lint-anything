name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          version="$(grep -m1 '^version' sdk/python/pyproject.toml | cut -d'"' -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python --outdir dist/

      - uses: ./.github/actions/verify-wheel
        with:
          dist: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@c16b6d83bfb52bfd58e6b880c8a66388284b26ef # v1.10.3
        with:
          user: __token__
          password: pypi-EXAMPLE
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Render changelog section
        uses: docker://ghcr.io/orhun/git-cliff:2.6.1
        with:
          args: --latest --strip header --output RELEASE_NOTES.md

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
